name: Desktop checks
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/test-packaged.mjs
        if: runner.os != 'Linux'
      - run: xvfb-run --auto-servernum node scripts/test-packaged.mjs
        if: runner.os == 'Linux'
      - run: xvfb-run --auto-servernum npm test
        if: runner.os == 'Linux'
        env:
          MARDAR_APP_PATH: ${{ github.workspace }}/release/Mardar-1.0.0.AppImage
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: Mardar-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
